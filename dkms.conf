PACKAGE_NAME="jetson-imx708-dual"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="nv_imx708"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/drivers/media/i2c"

MAKE[0]="make KERNEL_VER=${kernelver} KERNEL_SRC=${kernel_source_dir} modules"
